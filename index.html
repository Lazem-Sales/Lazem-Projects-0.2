<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081D24">
<title>المشاريع الطويلة · لازم للخدمات الطبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-wash"></div>
<div class="bg-grid"></div>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo-3d" id="logo3d">
        <div class="tilt">
          <span class="ring"></span>
          <span class="ring r2"></span>
          <img class="brand-logo" src="assets/logo-lazem-white.png" alt="شعار لازم للخدمات الطبية">
        </div>
      </div>
      <div>
        <p class="eyebrow"><span class="live-dot"></span>لازم للخدمات الطبية</p>
        <h1>المشاريع الطويلة</h1>
        <ul class="tagline">
          <li>عقود التشغيل الطبي الجارية</li>
          <li>عيادات ميدانية</li>
          <li>سيارات إسعاف</li>
        </ul>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="pulse-wrap" aria-hidden="true">
    <svg viewBox="0 0 1180 46" preserveAspectRatio="none">
      <path class="pulse-fade" d="M0 23 H1180"/>
      <path class="pulse-line" d="M0 23 L250 23 L268 23 L280 6 L298 42 L314 14 L326 23 L560 23 L574 23 L586 4 L604 44 L620 12 L632 23 L900 23 L912 6 L930 42 L946 14 L958 23 L1180 23"/>
    </svg>
  </div>

  <div class="section-head">
    <h2>العملاء والعقود</h2>
    <span>اضغط على أي عميل لعرض تفاصيل الخدمة</span>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <span>لازم للخدمات الطبية · Lazem Medical Services</span>
    <span id="asOf"></span>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
